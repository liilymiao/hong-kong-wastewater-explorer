name: Publish verified release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/scripts/build_release.py'
      - '.github/scripts/publish_release.py'
      - 'release/v1.6.3/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-v1.6.3
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'liilymiao/hong-kong-wastewater-explorer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download preserved release inputs
        run: |
          mkdir previous
          gh release download v1.6.2 --dir previous --pattern project.zip --pattern proposal-english.mp4 --pattern proposal-subtitled.mp4
      - name: Build and verify release assets
        run: |
          python .github/scripts/build_release.py --repo . --course-zip release/v1.6.3/course-python.zip --previous-project previous/project.zip --previous-video-dir previous --out release-out
      - name: Publish verified assets
        run: python .github/scripts/publish_release.py
